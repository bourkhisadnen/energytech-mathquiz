# Publishes ONLY the app's own files to GitHub Pages.
#
# Pages deployed straight from the branch serves the whole repository, which put
# tools/, google_apps_script/, README.md and package*.json on the live site. This
# workflow deploys the output of tools/stage-site.js instead: the files listed under
# "site" in tools/site-files.json, verified against the service worker's precache list.
# The build FAILS, and the previous deployment stays live, if a file is not classified
# there or the staged site is incomplete.
#
# THIS DOES NOT, BY ITSELF, STOP THE DEVELOPER FILES BEING SERVED. While the repository's
# Pages source is still "Deploy from a branch", GitHub also runs its own branch build on
# every push, and it accepts this deployment as well: two deployments are made for the one
# site, and whichever finishes last is what is served. Observed on 2026-09-21: the branch
# build (the whole tree, tools/ included) was the one left serving. The site works either
# way, since both serve the same app files; only this workflow's deployment hides the
# developer ones. What makes it deterministic is switching Settings -> Pages -> Build and
# deployment -> Source to "GitHub Actions" (owner only), which turns the branch build off.
# Then run this workflow once (Actions -> Deploy site to GitHub Pages -> Run workflow),
# and every later push to main redeploys. Its build job was proven green on GitHub's runner
# on 2026-09-21, so no dry run is needed first.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and let a running one finish rather than cancel it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stage the site
        run: node tools/stage-site.js "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
